<!DOCTYPE html>
<html>
<head>
    <title>Buddha's Wisdom Chat</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: 'Times New Roman', serif; /* More traditional font */
            background-color: #f8f0e3; /* Light beige background */
            color: #5c4033; /* Dark brown text */
            margin: 0; /* Remove default margins */
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensure full viewport height */
        }
        h1 {
            text-align: center;
            color: #8b4513; /* Brown header */
            padding: 20px;
            background-color: #f0e6d2; /* Light tan header background */
            margin: 0;
        }
        #chatbox {
            border: 2px solid #d2b48c; /* Light brown border */
            padding: 20px;
            margin: 20px;
            flex-grow: 1; /* Allow chatbox to take up available space */
            overflow-y: auto;
            background-color: #fffaf0; /* Off-white chatbox background */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
        }
        .user {
            color: #2e8b57; /* Sea green for user */
            background-color: #e0f0e0; /* Light green background for user */
            text-align: right;
        }
        .buddha {
            color: #8b4513; /* Brown for Buddha */
            background-color: #f5f5dc; /* Beige background for Buddha */
            text-align: left;
        }
        .error {
            color: #cc0000; /* Dark red for errors */
            background-color: #ffe0e0; /* Light red background for errors */
        }
        /* Basic styling for Markdown elements */
        p {
            margin-bottom: 10px;
            line-height: 1.6; /* Improved readability */
        }
        em, i {
            font-style: italic;
        }
        strong, b {
            font-weight: bold;
        }
        h1, h2, h3, h4, h5, h6 {
            margin-top: 1em;
            margin-bottom: 0.5em;
            color: #8b4513; /* Brown headers */
        }
        pre {
            background-color: #f0f0f0;
            padding: 10px;
            overflow-x: auto;
            border-radius: 5px;
        }
        code {
            font-family: monospace;
        }
        blockquote {
            border-left: 5px solid #d2b48c; /* Light brown border */
            padding-left: 15px;
            margin-left: 0;
            font-style: italic;
        }
        /* Loading animation styles */
        #loading {
            display: none; /* Hidden by default */
            text-align: center;
            margin-top: 20px;
        }
        .dharma-wheel-container {
            display: inline-block;
            width: 60px; /* Slightly larger */
            height: 60px; /* Slightly larger */
            position: relative;
        }
        .dharma-wheel {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Input and button styling */
        input[type="text"] {
            width: calc(100% - 100px); /* Adjust width */
            padding: 10px;
            margin: 20px;
            border: 1px solid #d2b48c;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #8b4513; /* Brown button */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #a0522d; /* Darker brown on hover */
        }
        /* Full-screen chatbox */
        html, body {
            height: 100%;
        }
        #chatbox {
            height: calc(100vh - 150px); /* Adjust height to fit screen */
            margin: 20px auto;
            width: 90%;
            max-width: 1200px;
        }
        .message strong {
            color: #8b4513;
        }
    </style>
</head>
<body>
    <h1>Buddha's Wisdom Chat</h1>
    <div id="chatbox">
        <div class="message buddha"><strong>Buddha:</strong> Welcome! Ask me anything about the Dharma.</div>
    </div>
    <div id="loading">
        <div class="dharma-wheel-container">
            <img class="dharma-wheel" src="./static/dharma_wheel.png" alt="Dharma Wheel">
        </div>
        <p>Seeking wisdom...</p>
    </div>
    <input type="text" id="inputBox" placeholder="Type your question here..." />
    <button id="sendButton">Send</button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputBox = document.getElementById('inputBox');
            const sendButton = document.getElementById('sendButton');
            const chatbox = document.getElementById('chatbox');
            const loading = document.getElementById('loading');

            // Set the backend API URL directly
            const backendUrl = "https://buddha-wisdom-465121314425.us-central1.run.app/query";

            // Geolocation lookup to track user origins
            let userCountry = "Unknown";
            fetch("https://ipapi.co/json/")
                .then(response => response.json())
                .then(data => {
                    if (data && data.country_name) {
                        userCountry = data.country_name;
                    }
                })
                .catch(err => {
                    console.warn("Could not determine user location:", err);
                });

            function sendMessage() {
                const message = inputBox.value.trim();
                if (message === "" || sendButton.disabled) return;
                inputBox.value = "";

                // Add the user message to the chatbox
                const userMsg = document.createElement('div');
                userMsg.classList.add('message', 'user');
                const userLabel = document.createElement('strong');
                userLabel.textContent = "You: ";
                userMsg.appendChild(userLabel);
                userMsg.appendChild(document.createTextNode(message));
                chatbox.appendChild(userMsg);
                chatbox.scrollTop = chatbox.scrollHeight; // Scroll to bottom

                // Show progress and prevent duplicate, costly requests.
                loading.style.display = "block";
                sendButton.disabled = true;
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 150000);

                fetch(backendUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        query: message,
                        country: userCountry
                    }),
                    signal: controller.signal
                })
                .then(async response => {
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || "The answer service is unavailable. Please try again.");
                    }
                    if (!data.response) {
                        throw new Error("The answer service returned an empty reply. Please try again.");
                    }
                    return data;
                })
                .then(data => {
                    const botMsg = document.createElement('div');
                    botMsg.classList.add('message', 'buddha');
                    botMsg.innerHTML = "<strong>Buddha:</strong> " + data.response;
                    chatbox.appendChild(botMsg);
                    chatbox.scrollTop = chatbox.scrollHeight;
                })
                .catch(error => {
                    console.error("Error:", error);
                    const errorMsg = document.createElement('div');
                    errorMsg.classList.add('message', 'error');
                    const errorText = error.name === "AbortError"
                        ? "This answer is taking too long. Please try again."
                        : error.message || "I encountered an error. Please try again.";
                    errorMsg.textContent = errorText;
                    chatbox.appendChild(errorMsg);
                    chatbox.scrollTop = chatbox.scrollHeight;
                })
                .finally(() => {
                    clearTimeout(timeout);
                    loading.style.display = "none";
                    sendButton.disabled = false;
                });
            }

            sendButton.addEventListener("click", sendMessage);

            inputBox.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
